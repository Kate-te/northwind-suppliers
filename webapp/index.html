<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northwind Suppliers</title>
    <script>
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            search: "hidden",
                            rootIntent: "Shell-home"
                        }
                    }
                }
            },
            services: {
                ClientSideTargetResolution: {
                    adapter: {
                        config: {
                            inbounds: {
                                "northwindsuppliers-display": {
                                    semanticObject: "northwindsuppliers",
                                    action: "display",
                                    title: "Suppliers",
                                    signature: {
                                        parameters: {},
                                        additionalParameters: "allowed"
                                    },
                                    resolutionResult: {
                                        applicationType: "SAPUI5",
                                        additionalInformation: "SAPUI5.Component=sap.btp.northwindsuppliers",
                                        url: ".",
                                        systemAlias: ""
                                    }
                                }
                            }
                        }
                    }
                }
            }
        };
    </script>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m,sap.ushell,sap.suite.ui.generic.template,sap.ui.comp,sap.ui.generic.app"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-resourceroots='{"sap.btp.northwindsuppliers": "./"}'
        data-sap-ui-xx-waitForTheme="init"
        data-sap-ui-frameOptions="allow"
    ></script>
    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ushell.Container.createRendererInternal("fiori2").then(function (oRenderer) {
                oRenderer.placeAt("content");
            });
        });
    </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
