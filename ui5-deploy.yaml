# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: sap.btp.northwindsuppliers
type: application
framework:
  name: SAPUI5
  version: "1.120.17"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.suite.ui.generic.template
    - name: sap.ui.comp
    - name: sap.ui.table
    - name: sap.ui.generic.app
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: northwindsuppliers
        relativePaths: true
        additionalFiles:
          - xs-app.json
